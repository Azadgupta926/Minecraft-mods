<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mod Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;800&display=swap">
<style>
:root{--bg:#f6f7f9;--surface:#fff;--text:#0f1713;--muted:#667085;--line:#e6e9ee;--accent:#16a34a;--accent2:#0d9488;--on-accent:#fff;--ad:#eceff3;--shadow:0 1px 2px rgba(16,24,40,.06),0 10px 28px rgba(16,24,40,.07);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c110e;--surface:#151c17;--text:#eef3ef;--muted:#93a198;--line:#243029;--accent:#4ade80;--accent2:#2dd4bf;--on-accent:#05210f;--ad:#1a231d;--shadow:0 1px 0 rgba(255,255,255,.04)}}
:root[data-theme="dark"]{--bg:#0c110e;--surface:#151c17;--text:#eef3ef;--muted:#93a198;--line:#243029;--accent:#4ade80;--accent2:#2dd4bf;--on-accent:#05210f;--ad:#1a231d;--shadow:0 1px 0 rgba(255,255,255,.04)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px;height:56px;font-weight:800;font-size:1.15rem}
.logo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:1rem}
.hero-t{padding:28px 0 8px}
.hero-t h1{margin:0;font-size:clamp(1.8rem,6vw,2.8rem);line-height:1.1;font-weight:800;letter-spacing:-.03em}
.hero-t p{margin:8px 0 0;color:var(--muted);max-width:46ch}
.search{position:relative;margin:18px 0 14px}
.search svg{position:absolute;left:16px;top:50%;translate:0 -50%;color:var(--muted)}
input[type=search]{width:100%;padding:15px 18px 15px 46px;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-weight:600;font-size:.9rem;padding:8px 16px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:999px;cursor:pointer;transition:background .15s,color .15s}
.chip[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(2,1fr);padding-bottom:32px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{display:block;overflow:hidden;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);transition:transform .15s}
.card:active{transform:scale(.97)}
.thumb{position:relative;aspect-ratio:4/3;display:grid;place-items:center;font-size:3rem}
.badge{position:absolute;left:10px;top:10px;padding:3px 10px;font-size:.7rem;font-weight:600;color:#fff;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-radius:999px}
.info{padding:12px 14px 14px}
.info h3{margin:0;font-size:.98rem;font-weight:700;line-height:1.3}
.meta{margin-top:2px;font-size:.8rem;color:var(--muted)}
.ad{grid-column:1/-1;min-height:96px;display:grid;place-items:center;text-align:center;background:var(--ad);color:var(--muted);font-size:.82rem;border-radius:20px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
#detail{position:fixed;inset:0;overflow:auto;background:var(--bg);z-index:5;animation:up .28s ease-out}
#detail[hidden]{display:none}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media(prefers-reduced-motion:reduce){#detail{animation:none}.card,.chip{transition:none}}
.dh{height:240px;display:grid;place-items:center;font-size:5.5rem;border-radius:0 0 32px 32px;position:relative;padding-top:env(safe-area-inset-top,0px)}
.back{position:absolute;left:16px;top:calc(14px + env(safe-area-inset-top,0px));padding:9px 16px;font-size:.9rem;font-weight:600;text-decoration:none;color:#fff;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:999px}
.dbody{padding-top:20px;padding-bottom:110px}
.dbody h2{margin:0;font-size:1.7rem;font-weight:800;letter-spacing:-.02em}
.pills{display:flex;gap:8px;margin:10px 0 16px}
.pill{padding:4px 12px;font-size:.8rem;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:999px}
.dbody p{margin:0 0 18px;max-width:60ch}
.cta{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 85%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.btn{display:block;max-width:600px;margin:0 auto;text-align:center;padding:15px;font-weight:700;text-decoration:none;color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:16px}
.note{font-size:.75rem;color:var(--muted);padding:0 0 28px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="bar"><div class="wrap"><span class="logo">⛏️</span>Mod Hub</div></div>
<main class="wrap">
  <section class="hero-t"><h1>Minecraft mods,<br>ek hi jagah.</h1><p>Addons, maps, skins aur texture packs. Search karo, detail dekho, official page se download karo.</p></section>
  <div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="q" placeholder="Mod ka naam search karo" aria-label="Search mods"></div>
  <div class="chips" id="chips"></div>
  <div class="grid" id="list"></div>
  <p class="note">Not an official Minecraft product. Not approved by or associated with Mojang or Microsoft.</p>
</main>
<div id="detail" hidden></div>
<script>
// === NAYA MOD ADD KARNE KE LIYE: neeche list mein ek line copy karke badlo ===
// n=naam, d=description, c=category, v=version, e=emoji, h=color (0-360), a=creator ka naam, u=official download page link
const MODS=[
 {n:"Night Vision",d:"Caves aur andhere wali jagahon mein behtar dikhai deta hai. Minecraft Bedrock 1.19 ya usse upar ke liye.",c:"Addons",v:"1.8.0",e:"🌙",h:235,a:"quillphen",u:"https://www.curseforge.com/minecraft-bedrock/addons/cave-vision-bedrock"},
 {n:"Sample Addon One",d:"Ye ek sample entry hai. Apna asli mod, description aur official download link yahan daalo.",c:"Addons",v:"1.0",e:"⚔️",h:140,u:"https://example.com"},
 {n:"Sample Map Two",d:"Adventure map ka sample. Screenshots aur details baad mein add kar sakte ho.",c:"Maps",v:"2.1",e:"🗺️",h:25,u:"https://example.com"},
 {n:"Sample Skin Pack",d:"Skins ka sample pack. Description mein 2-3 line kaafi hain.",c:"Skins",v:"1.3",e:"🧑",h:205,u:"https://example.com"},
 {n:"Sample Texture Pack",d:"Texture pack ka sample entry.",c:"Texture Packs",v:"1.0",e:"🧱",h:275,u:"https://example.com"},
 {n:"Sample Addon Two",d:"Ek aur addon ka sample, taaki list aur ad slot ka layout dikhe.",c:"Addons",v:"0.9",e:"🐉",h:345,u:"https://example.com"}
];
const CATS=["All","Addons","Maps","Skins","Texture Packs"];
// AdSense milne ke baad is HTML ki jagah apna ad code lagana
const AD='<div class="ad">Ad yahan dikhega<br>(AdSense code lagao)</div>';
let cat="All",q="";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const bg=h=>`linear-gradient(135deg,hsl(${h} 60% 52%),hsl(${(h+45)%360} 60% 34%))`;
function chips(){$("#chips").innerHTML=CATS.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}
function list(){
  const items=MODS.map((m,i)=>({m,i})).filter(({m})=>(cat==="All"||m.c===cat)&&m.n.toLowerCase().includes(q));
  if(!items.length){$("#list").innerHTML='<div class="empty">Koi mod nahi mila. Doosra naam ya category try karo.</div>';return}
  $("#list").innerHTML=items.map(({m,i},k)=>`${k>0&&k%4===0?AD:""}<a class="card" href="#m${i}"><div class="thumb" style="background:${bg(m.h)}"><span class="badge">${esc(m.c)}</span>${m.e}</div><div class="info"><h3>${esc(m.n)}</h3><div class="meta">Version ${esc(m.v)}</div></div></a>`).join("");
}
function route(){
  const d=$("#detail"),m=/^#m\d+$/.test(location.hash)&&MODS[+location.hash.slice(2)];
  if(!m){d.hidden=true;return}
  d.innerHTML=`<div class="dh" style="background:${bg(m.h)}"><a class="back" href="#">Wapas</a>${m.e}</div><div class="wrap dbody"><h2>${esc(m.n)}</h2><div class="pills"><span class="pill">${esc(m.c)}</span><span class="pill">Version ${esc(m.v)}</span>${m.a?`<span class="pill">by ${esc(m.a)}</span>`:""}</div><p>${esc(m.d)}</p>${AD}<p class="note" style="margin-top:18px">Download link mod ke creator ke official page par le jata hai. Not an official Minecraft product.</p></div><div class="cta"><a class="btn" href="${esc(m.u)}" target="_blank" rel="noopener nofollow">Official page pe download karo</a></div>`;
  d.hidden=false;d.scrollTop=0;
}
$("#q").addEventListener("input",e=>{q=e.target.value.toLowerCase().trim();list()});
$("#chips").addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(b){cat=b.dataset.c;chips();list()}});
window.addEventListener("hashchange",route);
chips();list();route();
</script>
</body>
</html>
